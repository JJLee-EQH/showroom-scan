<!doctype html>
<html lang="en">
<head>
<!-- ====================================================================================

     ==================================================================================== -->
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbx2dsvlysR8l3rACA9rjOz7YeMt8D3VYCs6jvR2HI2gt2csDY6P9JWvECF8Xb50UZqzWg/exec';
var REFRESH_MS = 20000;   /* how often an open phone re-reads the lines, in milliseconds */
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Showroom scan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page: #EEF1F3;
  --surface: #FFFFFF;
  --ink: #16222E;
  --muted: #5B6875;
  --line: #D5DBE0;
  --primary: #1D4F7A;
  --primary-ink: #FFFFFF;
  --ok: #1B7A4B;
  --ok-bg: #E3F3EA;
  --warn: #8A5200;
  --warn-bg: #FBEFD6;
  --laser: #E5382B;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0F161D; --surface: #18222C; --ink: #E8EDF1; --muted: #9AA7B3; --line: #2B3946;
    --primary: #6FB0E6; --primary-ink: #0B1620; --ok: #5CCB8F; --ok-bg: #143325;
    --warn: #F0B95A; --warn-bg: #3A2C10; --laser: #FF5A4D;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0F161D; --surface: #18222C; --ink: #E8EDF1; --muted: #9AA7B3; --line: #2B3946;
  --primary: #6FB0E6; --primary-ink: #0B1620; --ok: #5CCB8F; --ok-bg: #143325;
  --warn: #F0B95A; --warn-bg: #3A2C10; --laser: #FF5A4D;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.4;
  font-variant-numeric: tabular-nums;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 12px 16px 10px;
}
.top-in, .list, .dock-in { max-width: 720px; margin: 0 auto; }
.top-row { display: flex; align-items: center; gap: 10px; }
.quote-sel {
  flex: 1; min-width: 0; appearance: none; -webkit-appearance: none;
  background: transparent; border: 0; padding: 4px 22px 4px 0;
  font-size: 22px; font-weight: 600; letter-spacing: 0.01em;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 9px) 55%, calc(100% - 3px) 55%;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
.link-btn {
  background: none; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.sub { display: flex; justify-content: space-between; gap: 12px; margin-top: 2px; font-size: 14px; color: var(--muted); }
.sub b { color: var(--ink); font-weight: 600; }
.tools { display: flex; gap: 8px; margin-top: 10px; }
.search {
  flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--page); font-size: 16px;
}
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { background: none; border: 0; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* ---------- list ---------- */
.list { padding: 0 0 112px; }
.row {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: start;
  width: 100%; text-align: left; background: var(--surface);
  border: 0; border-bottom: 1px solid var(--line); border-left: 4px solid transparent;
  padding: 12px 16px 12px 12px;
}
.row.is-marked { border-left-color: var(--ok); }
.row-no { font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
.row-name { grid-column: 1; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.row-side { grid-row: 1; grid-column: 2; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding-top: 4px; }
.row-side svg { flex: none; }
.row-remark {
  grid-column: 1 / -1; margin-top: 6px; padding: 6px 10px; border-radius: 6px;
  background: var(--ok-bg); color: var(--ok); font-size: 15px; font-weight: 500; overflow-wrap: anywhere;
}
.section-h { padding: 22px 16px 8px; font-size: 14px; font-weight: 600; color: var(--warn); }
.row.is-extra { border-left-color: var(--warn); }
.row.is-extra .row-remark { background: var(--warn-bg); color: var(--warn); }
.state { padding: 40px 20px; text-align: center; color: var(--muted); }
.state b { display: block; color: var(--ink); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.notice { margin: 12px 16px 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }

/* ---------- dock ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--page) 70%, transparent);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 10px 18px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 16px;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }
.btn.danger { color: var(--laser); }
.btn[disabled] { opacity: 0.55; cursor: default; }
.btn.big { width: 100%; min-height: 60px; font-size: 19px; border-radius: 14px; box-shadow: 0 6px 18px rgba(22, 34, 46, 0.22); }

/* ---------- scan overlay (always dark: it is a viewfinder) ---------- */
.scan { position: fixed; inset: 0; z-index: 20; background: #05080B; color: #F2F5F7; display: flex; flex-direction: column; }
.scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-top, .scan-bottom { position: relative; z-index: 2; padding: 12px 16px; }
.scan-top { padding-top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(5, 8, 11, 0.8), transparent); }
.scan-title { font-weight: 600; }
.scan-close { background: rgba(255, 255, 255, 0.14); border: 0; color: #fff; border-radius: 999px; min-height: 44px; padding: 0 18px; font-weight: 500; }
.finder { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.finder-box { position: relative; width: min(86vw, 520px); height: min(32vh, 240px); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(5, 8, 11, 0.45); }
.finder-box::before, .finder-box::after { content: ""; position: absolute; width: 34px; height: 34px; border: 3px solid #fff; }
.finder-box::before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.finder-box::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.laser { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--laser); box-shadow: 0 0 10px 1px var(--laser); animation: sweep 2.4s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: translateY(-36px); } to { transform: translateY(36px); } }
@media (prefers-reduced-motion: reduce) { .laser { animation: none; } }
.scan.is-hit .finder-box { box-shadow: 0 0 0 100vmax rgba(27, 122, 75, 0.5); }
.scan-bottom { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(5, 8, 11, 0.92) 60%, transparent); }
.scan-msg { min-height: 2.8em; margin: 0 0 12px; text-align: center; font-size: 15px; }
.scan-actions { display: flex; gap: 10px; }
.scan-actions .btn { flex: 1; background: rgba(255, 255, 255, 0.14); border-color: transparent; color: #fff; font-size: 15px; padding: 10px; }
.type-row { display: flex; gap: 8px; margin-top: 10px; }
.type-row input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 18px; letter-spacing: 0.04em; }
.type-row .btn { background: #fff; color: #05080B; border-color: #fff; font-weight: 600; }

/* ---------- sheet ---------- */
.veil { position: fixed; inset: 0; z-index: 30; background: rgba(5, 8, 11, 0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 720px; max-height: 92%; overflow-y: auto;
  background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0;
  padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: rise 0.18s ease-out;
}
@keyframes rise { from { transform: translateY(28px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-no { font-size: 28px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.15; overflow-wrap: anywhere; }
.sheet-name { margin-top: 4px; color: var(--muted); overflow-wrap: anywhere; }
.sheet-meta { margin-top: 8px; font-size: 14px; color: var(--muted); }
.sheet-meta.warn { color: var(--warn); }
.field { display: block; margin-top: 16px; }
.field span { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.field input, .field textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--page); font-size: 18px; }
.field textarea { resize: vertical; min-height: 76px; font-size: 16px; }
.form-msg { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--warn); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.sheet-actions .btn { flex: 1 1 140px; }
.pick { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 0; }
.pick b { display: block; font-size: 18px; font-weight: 600; }
.pick span { color: var(--muted); font-size: 14px; }

.foot { padding: 22px 16px 0; font-size: 14px; color: var(--muted); }
.foot b { color: var(--ink); font-weight: 600; }
.sheet.is-busy label.btn { pointer-events: none; opacity: 0.55; }
.sheet-list { margin: 10px 0 0; padding-left: 18px; font-size: 14px; color: var(--warn); }
.text-btn { background: none; border: 0; padding: 0; color: var(--primary); font-weight: 500; text-decoration: underline; }
.state .btn { margin: 0 auto; }
.gate { position: fixed; inset: 0; z-index: 50; background: var(--page); display: flex; align-items: center; justify-content: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.gate-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; }
.gate-card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.gate-card p { margin: 0; color: var(--muted); }
.gate-card .btn { width: 100%; margin-top: 8px; }
.gate-card .form-msg { color: var(--warn); margin-top: 12px; }

.toast {
  position: fixed; left: 50%; top: calc(72px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  z-index: 40; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px;
  font-size: 15px; font-weight: 500; max-width: 90vw; text-align: center;
}

/* ---------- version 2 additions ---------- */
.dock-row { display: flex; gap: 10px; margin-top: 10px; }
.dock-row .btn { flex: 1; min-height: 46px; font-size: 15px; padding: 8px; box-shadow: 0 4px 12px rgba(22, 34, 46, 0.14); }
.list { padding-bottom: 176px; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-size: 12px; font-weight: 500; vertical-align: middle; }
.photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ph { position: relative; width: 84px; height: 84px; border-radius: 10px; overflow: hidden; background: var(--page); border: 1px solid var(--line); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph img:not([src]) { visibility: hidden; }
.ph-x { position: absolute; top: 2px; right: 2px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(5, 8, 11, 0.7); color: #fff; font-size: 18px; line-height: 1; }
.ph-add { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; font-weight: 500; color: var(--primary); border-style: dashed; cursor: pointer; }
.sheet.is-busy .ph-add { pointer-events: none; opacity: 0.55; }
.scan-actions + .scan-actions { margin-top: 10px; }
.scan-actions .btn.solid { background: #fff; color: #05080B; font-weight: 600; font-size: 16px; }
#findOut { margin-top: 10px; max-height: 44vh; overflow-y: auto; }
.scan-note { position: relative; z-index: 3; margin: 4px 16px 0; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.96); color: #16222E; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
.scan-note b { display: block; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.scan-note span { display: block; font-size: 14px; color: #5B6875; overflow-wrap: anywhere; }
.scan-note.is-bad b { color: #B42318; }
.note-btns { display: flex; gap: 8px; margin-top: 10px; }
.note-btns:empty { display: none; }
.note-btns button { flex: 1; min-height: 42px; border-radius: 9px; border: 1px solid #D5DBE0; background: #fff; color: #16222E; font-weight: 500; font-size: 15px; }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="top-row">
      <select id="quoteSel" class="quote-sel" aria-label="Quotation"></select>
      <button id="refreshBtn" class="link-btn" data-act="refresh" hidden>Refresh</button>
    </div>
    <div class="sub"><span id="customer"></span><span id="progress"></span></div>
  </div>
</header>

<div id="notice" class="notice" hidden></div>
<main id="list" class="list" aria-live="polite"></main>

<div class="dock" id="dock" hidden><div class="dock-in">
  <button class="btn primary big" data-act="scan">
    <svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true"><g fill="currentColor"><rect x="0" width="2" height="20"/><rect x="4" width="1" height="20"/><rect x="7" width="3" height="20"/><rect x="12" width="1" height="20"/><rect x="15" width="2" height="20"/><rect x="19" width="1" height="20"/><rect x="22" width="1" height="20"/><rect x="24" width="2" height="20"/></g></svg>
    Scan barcode or item number
  </button>
  <div class="dock-row">
    <button class="btn" data-act="find">Find by typing</button>
    <button class="btn" data-act="new-item">New item with photos</button>
  </div>
</div></div>

<div id="scan" class="scan" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="scan-top">
    <span class="scan-title">Scan</span>
    <button class="scan-close" data-act="scan-close">Close</button>
  </div>
  <div id="scanNote" class="scan-note" role="status" hidden></div>
  <div class="finder"><div class="finder-box"><div class="laser"></div></div></div>
  <div class="scan-bottom">
    <p id="scanMsg" class="scan-msg" role="status"></p>
    <div class="scan-actions">
      <button class="btn solid" data-act="read-text">Read item number</button>
    </div>
    <div class="scan-actions">
      <label class="btn" for="photoIn">Photo of barcode</label>
      <button class="btn" data-act="type-toggle">Type the barcode</button>
    </div>
    <input id="photoIn" type="file" accept="image/*" capture="environment" hidden>
    <input id="ocrIn" type="file" accept="image/*" capture="environment" hidden>
    <div class="type-row" id="typeRow" hidden>
      <input id="typeIn" inputmode="numeric" autocomplete="off" placeholder="EAN digits" aria-label="EAN digits">
      <button class="btn" data-act="type-go">Look up</button>
    </div>
  </div>
</div>

<input id="newPhotoIn" type="file" accept="image/*" multiple hidden>

<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card" autocomplete="off">
    <h1>Showroom scan</h1>
    <p>Enter the team access code to open the quotations.</p>
    <label class="field"><span>Team access code</span><input id="gCode" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="field"><span>Your name</span><input id="gName" type="text" autocomplete="name" maxlength="60"></label>
    <p class="form-msg" id="gMsg" role="alert"></p>
    <button class="btn primary" type="submit" id="gGo">Open</button>
  </form>
</div>

<div id="veil" class="veil" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script>
/* ===== Barcode decoding: native detector, then ZXing, then Quagga. Shared by live and photo paths. ===== */
var Decoder = (function () {
  var FORMATS_NATIVE = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
  var nativeDetector = null, nativeChecked = false;

  function digitsOnly(s) { return String(s == null ? '' : s).replace(/\D/g, ''); }

  /* GTIN check digit (8, 12, 13 or 14 digits). */
  function checkDigitOk(d) {
    if (!/^\d+$/.test(d) || [8, 12, 13, 14].indexOf(d.length) < 0) return false;
    var sum = 0;
    for (var i = d.length - 2, w = 3; i >= 0; i--, w = 4 - w) sum += (d.charCodeAt(i) - 48) * w;
    return (10 - (sum % 10)) % 10 === d.charCodeAt(d.length - 1) - 48;
  }

  /* One comparable key for any EAN / UPC / GTIN: digits, left-padded to 14. */
  function gtinKey(s) {
    var d = digitsOnly(s);
    if (d.length < 8 || d.length > 14) return '';
    return ('00000000000000' + d).slice(-14);
  }

  function getNative() {
    if (nativeChecked) return Promise.resolve(nativeDetector);
    nativeChecked = true;
    if (!('BarcodeDetector' in window)) return Promise.resolve(null);
    return window.BarcodeDetector.getSupportedFormats().then(function (f) {
      var use = FORMATS_NATIVE.filter(function (x) { return f.indexOf(x) >= 0; });
      if (use.length) nativeDetector = new window.BarcodeDetector({ formats: use });
      return nativeDetector;
    }).catch(function () { return null; });
  }

  var zxReader = null, lastSpan = null;      /* lastSpan: where across the picture the last barcode sat, as fractions of the width */
  function zxingDecode(canvas) {
    lastSpan = null;
    if (!window.ZXing) return null;
    var Z = window.ZXing;
    if (!zxReader) {
      var hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      zxReader = new Z.MultiFormatReader();
      zxReader.setHints(hints);
    }
    var src = new Z.HTMLCanvasElementLuminanceSource(canvas);
    var bins = [Z.HybridBinarizer, Z.GlobalHistogramBinarizer];
    for (var i = 0; i < bins.length; i++) {
      try {
        var res = zxReader.decodeWithState(new Z.BinaryBitmap(new bins[i](src)));
        if (res && res.getText()) {
          try {
            var xs = (res.getResultPoints() || []).map(function (pt) { return pt.getX(); });
            if (xs.length >= 2) lastSpan = [Math.min.apply(null, xs) / canvas.width, Math.max.apply(null, xs) / canvas.width];
          } catch (e) { /* the position is a nicety */ }
          return res.getText();
        }
      } catch (e) { /* not found is the normal miss */ }
    }
    return null;
  }

  function quaggaDecode(canvas, size) {
    return new Promise(function (resolve) {
      if (!window.Quagga) return resolve(null);
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(null); } }, 6000);
      try {
        window.Quagga.decodeSingle({
          src: canvas.toDataURL('image/jpeg', 0.9),
          numOfWorkers: 0,
          locate: true,
          inputStream: { size: size },
          locator: { patchSize: 'medium', halfSample: true },
          decoder: { readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader'] }
        }, function (r) {
          if (done) return; done = true; clearTimeout(t);
          resolve(r && r.codeResult && r.codeResult.code ? r.codeResult.code : null);
        });
      } catch (e) { if (!done) { done = true; clearTimeout(t); resolve(null); } }
    });
  }

  /* Draw a source scaled so its longest side is maxDim, optionally rotated 90 degrees and/or cropped. */
  function toCanvas(source, sw, sh, maxDim, rot90, crop) {
    crop = crop || { x: 0, y: 0, w: sw, h: sh };
    var s = Math.min(1, maxDim / Math.max(crop.w, crop.h));

      (text ? '<span class="row-remark">' + esc(text) + '</span>' : '') +
      '</button>';
  }
  function render() {
    var sel = $('quoteSel'), q = S.quote;
    var canAdd = CONNECTED && S.status === 'ready';
    sel.innerHTML = (S.quotes.length
      ? (q ? '' : '<option value="">Choose a quotation</option>') + S.quotes.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === S.qid ? ' selected' : '') + '>' + esc(x.customer) + '</option>'; }).join('')
      : '<option value="">Showroom scan</option>') + (canAdd ? '<option value="__new__">New quotation…</option>' : '');
    sel.disabled = !canAdd;
    $('customer').textContent = q ? q.id + (q.by ? ', started by ' + q.by : '') : '';
    $('progress').innerHTML = q ? '<b>' + S.lines.length + '</b> ' + (S.lines.length === 1 ? 'line' : 'lines') : '';
    $('refreshBtn').hidden = !(S.status === 'ready' || S.status === 'error') || !CONNECTED;
    $('dock').hidden = !q;
    var notes = [];
    if (S.offline) notes.push('No connection to the storage. Showing what was loaded at ' + clock(S.syncedAt) + '; nothing can be saved until the signal is back.');
    if (S.status === 'ready' && catalogLine()) notes.push(catalogLine());
    var n = $('notice'); n.textContent = notes.join(' '); n.hidden = !notes.length;

    var list = $('list');
    if (!q) {
      var msg = {
        unconfigured: '<b>This copy isn’t connected yet</b>Paste the web app URL into the API_URL line at the top of the file and upload it again.',
        gate: '',
        loading: '<b>Loading…</b>',
        error: '<b>The quotations can’t be loaded</b>' + esc(S.problem) + '<br><br><button class="btn" data-act="refresh">Try again</button>',
        ready: '<b>' + (S.quotes.length ? 'No quotation is open' : 'No quotation yet') + '</b>Start one when a customer arrives.<br><br><button class="btn primary" data-act="new-quote">New quotation</button>'
      }[S.status];

    }
    var html = S.lines.map(rowHtml).join('');
    if (!S.lines.length) html = '<div class="state"><b>No lines yet</b>Scan a barcode, read a printed item number, find an item by typing, or add a new item with photos.</div>';
    html += '<div class="foot"><button class="text-btn" data-act="new-quote">New quotation</button></div>' +
      '<div class="foot">' + (S.cat.state === 'ready' ? 'Item list: ' + S.cat.items.length.toLocaleString() + ' items' + (S.cat.at ? ', refreshed ' + new Date(S.cat.at).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '') + '. ' : '') +
      'Saving as <b>' + esc(S.name) + '</b>. <button class="text-btn" data-act="signout">Change name or code</button></div>';

  }

  /* ---------- sheets ---------- */
  var VIA = { camera: 'Barcode read with the camera', photo: 'Barcode read from a photo', typed: 'Barcode typed in', text: 'Item number read by the camera', both: 'Barcode and item number agreed', find: 'Found by typing' };

  function pickHtml(items) {
    return items.map(function (it) {

      return '<button class="pick" data-act="pick-item" data-item="' + esc(it.item) + '"><b>' + esc(it.item) + (has ? ' <span class="tag">in this quotation</span>' : '') + '</b><span>' + esc(it.name) + '</span></button>';
    }).join('');
  }
  function photoStripHtml(sh) {

    });

  function openSheet(sh) {
    S.sheet = sh;

    el.classList.remove('is-busy');
    if (sh.type === 'line') {
      var l = sh.id ? lineById(sh.id) : null, it = sh.item || { item: l.item, ean: l.ean, name: l.name };
      var meta = (it.ean ? 'EAN ' + esc(it.ean) : 'No barcode in the item list') + '.';
      if (VIA[sh.via]) meta += ' ' + VIA[sh.via] + '.';
      if (l) meta += ' Already in this quotation' + (l.updatedBy ? ', last saved by ' + esc(l.updatedBy) : '') + '.';
      html = '<div class="sheet-no">' + esc(it.item) + '</div><div class="sheet-name">' + esc(it.name) + '</div><div class="sheet-meta">' + meta + '</div>' +
        '<label class="field"><span>Quantity</span><input id="fQty" inputmode="numeric" autocomplete="off" maxlength="40" value="' + esc(l ? l.qty : '') + '"></label>' +
        '<label class="field"><span>Note</span><textarea id="fNote" rows="2" maxlength="1000">' + esc(l ? l.note : '') + '</textarea></label>' +
        '<p class="form-msg" id="fMsg" role="alert"></p><div class="sheet-actions">' +
        '<button class="btn primary" data-act="save-line">' + (l ? 'Save changes' : 'Add to quotation') + '</button>' +
        '<button class="btn" data-act="sheet-close">' + back + '</button>' +
        (l ? '<button class="btn danger" data-act="remove-line">Remove line</button>' : '') + '</div>';
    } else if (sh.type === 'newitem') {
      var n = sh.id ? lineById(sh.id) : null;
      if (n && sh.photos === undefined) { sh.photos = n.photos.slice(); }
      if (sh.pending === undefined) sh.pending = [];
      html = '<div class="sheet-no">New item</div><div class="sheet-meta">For something that is not in the item list' + (sh.ean ? ' (barcode ' + esc(sh.ean) + ')' : '') + '. Add photos and describe what the customer wants.</div>' +
        photoStripHtml(sh) +
        '<label class="field"><span>Description</span><textarea id="fNote" rows="3" maxlength="1000">' + esc(sh.note !== undefined ? sh.note : (n ? n.note : '')) + '</textarea></label>' +
        '<label class="field"><span>Quantity</span><input id="fQty" inputmode="numeric" autocomplete="off" maxlength="40" value="' + esc(sh.qty !== undefined ? sh.qty : (n ? n.qty : '')) + '"></label>' +
        '<p class="form-msg" id="fMsg" role="alert"></p><div class="sheet-actions">' +
        '<button class="btn primary" data-act="save-new">' + (n ? 'Save changes' : 'Add to quotation') + '</button>' +
        '<button class="btn" data-act="sheet-close">' + back + '</button>' +
        (n ? '<button class="btn danger" data-act="remove-line">Remove line</button>' : '') + '</div>';
    } else if (sh.type === 'pick') {
      html = '<div class="sheet-no">' + esc(sh.title) + '</div><div class="sheet-meta">' + esc(sh.text) + '</div>' + pickHtml(sh.items) +
        (sh.more && sh.more.length ? '<div class="sheet-meta">Others that start the same way</div>' + pickHtml(sh.more) : '') +
        '<div class="sheet-actions"><button class="btn" data-act="find">Find by typing</button><button class="btn" data-act="sheet-close">' + back + '</button></div>';
    } else if (sh.type === 'find') {
      html = '<div class="sheet-no">Find an item</div>' +
        '<label class="field"><span>Item number or words from the name</span><input id="findIn" autocomplete="off" autocapitalize="characters" spellcheck="false" value="' + esc(sh.q || '') + '"></label>' +
        '<div id="findOut"></div>' +
        '<div class="sheet-actions"><button class="btn" data-act="new-item">It is a new item</button><button class="btn" data-act="sheet-close">' + back + '</button></div>';
    } else if (sh.type === 'notfound') {
      html = '<div class="sheet-no">' + esc(sh.title) + '</div><div class="sheet-meta warn">' + esc(sh.text) + '</div>' +
        '<div class="sheet-actions"><button class="btn primary" data-act="find">Find by typing</button>' +
        '<button class="btn" data-act="new-item">Add as a new item</button><button class="btn" data-act="sheet-close">' + back + '</button></div>';
    } else if (sh.type === 'newquote') {
      html = '<div class="sheet-no">New quotation</div><div class="sheet-meta">It starts empty. Lines are added by scanning.</div>' +
        '<label class="field"><span>Customer</span><input id="fCustomer" autocomplete="off" maxlength="120"></label>' +
        '<p class="form-msg" id="fMsg" role="alert"></p><div class="sheet-actions">' +
        '<button class="btn primary" data-act="create-quote">Start quotation</button><button class="btn" data-act="sheet-close">Cancel</button></div>';
    } else if (sh.type === 'info') {
      html = '<div class="sheet-no">' + esc(sh.title) + '</div><div class="sheet-meta">' + esc(sh.text) + '</div>' +
        '<div class="sheet-actions"><button class="btn primary" data-act="sheet-close">OK</button></div>';
    }
    el.innerHTML = html;
    $('veil').hidden = false;
    el.scrollTop = 0;
    var focus = sh.type === 'find' ? $('findIn') : sh.type === 'newquote' ? $('fCustomer') : (sh.type === 'line' && !sh.id) ? $('fQty') : null;
    if (focus) { try { focus.focus({ preventScroll: true }); } catch (e) { focus.focus(); } }
    if (sh.type === 'find') renderFind();
    if (sh.type === 'newitem') loadPhotos(sh.photos || []);
  }
  function closeSheet() {
    var sh = S.sheet;
    S.sheet = null; S.saving = false;
    $('sheet').classList.remove('is-busy');
    $('veil').hidden = true;
    if (S.scan.open) {
      if (sh && sh.code) { S.scan.cool = sh.code; S.scan.coolUntil = Date.now() + 2500; }
      if (sh && sh.items) sh.items.forEach(function (it) { quiet(it.item); });
      if (sh && sh.item) quiet(sh.item.item);
      resumeLive();
    }
  }
  function setSaving(on, label) {
    S.saving = on;
    $('sheet').classList.toggle('is-busy', !!on);
    Array.prototype.forEach.call($('sheet').querySelectorAll('button'), function (b) { b.disabled = on; });
    var m = $('fMsg'); if (m && on) m.textContent = label || '';
  }
  function formMsg(t) { var m = $('fMsg'); if (m) m.textContent = t || ''; }
  function writeFailed(e, what) {
    S.seq++;
    if (e && e.error === 'bad_code') { showGate(problemText(e)); return; }
    setSaving(false);
    formMsg(e && e.error === 'network' ? 'Not ' + what + ': no connection to the storage. Check the signal and try again.' : problemText(e));
  }

  function renderFind() {
    var box = $('findOut'), inp = $('findIn'); if (!box || !inp) return;
    S.sheet.q = inp.value;
    if (S.cat.state !== 'ready') { box.innerHTML = '<div class="sheet-meta warn">' + esc(catalogLine() || 'The item list is not on this phone yet.') + '</div>'; return; }
    var q = inp.value.trim();
    if (q.length < 2) { box.innerHTML = '<div class="sheet-meta">Type at least two characters.</div>'; return; }
    var res = searchItems(q, 30);
    box.innerHTML = res.length ? pickHtml(res) : '<div class="sheet-meta warn">Nothing in the item list matches “' + esc(q) + '”.</div>';
  }

  /* choose an item (from a scan, the read text, or typing): open its line, new or existing */
  function chooseItem(it, via, code) {
    var has = lineForItem(it.item);
    openSheet({ type: 'line', id: has ? has.id : null, item: has ? null : it, via: via, code: code || '' });
  }

  function saveLine() {
    var sh = S.sheet; if (!sh || sh.type !== 'line' || S.saving) return;
    var old = sh.id ? lineById(sh.id) : null, it = sh.item || { item: old.item, ean: old.ean, name: old.name };
    var line = { id: old ? old.id : (sh.newId = sh.newId || newId()), type: 'item', item: it.item, ean: it.ean, name: it.name,
                 qty: $('fQty').value.trim(), note: $('fNote').value.trim(), via: sh.via || 'find' };
    S.seq++;
    setSaving(true, 'Saving…');
    api('line', { quotation: S.qid, line: line, by: S.name }).then(function (j) {
      S.seq++; S.lines = j.lines || []; S.syncedAt = Date.now(); S.offline = false;
      toast(old ? 'Saved ' + it.item : 'Added ' + it.item);
      closeSheet(); render();
    }).catch(function (e) { writeFailed(e, 'saved'); });
  }

  function removeLine() {
    var sh = S.sheet; if (!sh || !sh.id || S.saving) return;
    S.seq++;
    setSaving(true, 'Removing…');
    api('unline', { quotation: S.qid, id: sh.id }).then(function (j) {
      S.seq++; S.lines = j.lines || []; S.syncedAt = Date.now();
      toast('Line removed'); closeSheet(); render();
    }).catch(function (e) { writeFailed(e, 'removed'); });
  }

  /* ---------- new items with photos ---------- */
  function shrinkPhoto(file) {
    /* photos are saved at most 1600 px on the long side, as JPEG */
    var load = window.createImageBitmap
      ? window.createImageBitmap(file).then(function (b) { return { el: b, w: b.width, h: b.height }; })
      : Promise.reject(new Error('no createImageBitmap'));
    return load.catch(function () {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onerror = function () { reject(new Error('read failed')); };
        fr.onload = function () { var im = new Image(); im.onload = function () { resolve({ el: im, w: im.naturalWidth, h: im.naturalHeight }); }; im.onerror = function () { reject(new Error('decode failed')); }; im.src = fr.result; };
        fr.readAsDataURL(file);
      });
    }).then(function (src) {
      var s = Math.min(1, 1600 / Math.max(src.w, src.h));
      var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(src.w * s)); c.height = Math.max(1, Math.round(src.h * s));
      c.getContext('2d').drawImage(src.el, 0, 0, c.width, c.height);
      var url = c.toDataURL('image/jpeg', 0.8);
      return { url: url, data: url.slice(url.indexOf(',') + 1) };
    });
  }
  function keepNewItemFields() {
    var sh = S.sheet; if (!sh || sh.type !== 'newitem') return;
    if ($('fNote')) sh.note = $('fNote').value;
    if ($('fQty')) sh.qty = $('fQty').value;
  }
  function onNewPhotos(files) {
    var sh = S.sheet; if (!sh || sh.type !== 'newitem' || S.saving) return;
    keepNewItemFields();
    var list = Array.prototype.slice.call(files), room = 8 - (sh.photos || []).length - sh.pending.length;
    if (list.length > room) { list = list.slice(0, Math.max(0, room)); }
    formMsg('Preparing the photo…');
    list.reduce(function (p, f) {
      return p.then(function () { return shrinkPhoto(f).then(function (ph) { sh.pending.push(ph); }); });
    }, Promise.resolve()).then(function () {
      if (S.sheet === sh) { openSheet(sh); if (room <= 0) formMsg('A line can hold 8 photos.'); }
    }).catch(function () { if (S.sheet === sh) { openSheet(sh); formMsg('That photo couldn’t be opened. Take it again.'); } });
  }
  function loadPhotos(ids) {
    ids.forEach(function (id) {
      if (S.photos[id]) return;
      api('photo_get', { photo: id }, 60000).then(function (j) {
        S.photos[id] = 'data:' + (j.mime || 'image/jpeg') + ';base64,' + j.data;
        var img = document.querySelector('img[data-photo="' + id + '"]'); if (img) img.src = S.photos[id];
      }).catch(function () { /* the frame stays empty; reopening the line tries again */ });
    });
  }
  function saveNewItem() {
    var sh = S.sheet; if (!sh || sh.type !== 'newitem' || S.saving) return;
    keepNewItemFields();
    var note = (sh.note || '').trim(), qty = (sh.qty || '').trim();
    if (!note && !sh.pending.length && !(sh.photos || []).length) { formMsg('Add a photo or a description.'); return; }
    var id = sh.id || (sh.newId = sh.newId || newId()), isNew = !sh.id;
    S.seq++;
    setSaving(true, 'Saving…');
    api('line', { quotation: S.qid, line: { id: id, type: 'new', ean: sh.ean || '', qty: qty, note: note, via: sh.via || 'new' }, by: S.name }).then(function (j) {
      S.lines = j.lines || []; sh.id = id;                      /* the line exists now; photos attach to it */
      var total = sh.pending.length, done = 0;
      function next() {
        if (!sh.pending.length) return Promise.resolve();
        formMsg('Saving photo ' + (done + 1) + ' of ' + total + '…');
        var ph = sh.pending[0];
        return api('photo_add', { quotation: S.qid, id: id, data: ph.data, by: S.name }, 120000).then(function (r) {
          S.photos[r.photo] = ph.url; sh.pending.shift(); sh.photos = (sh.photos || []).concat([r.photo]); S.lines = r.lines || S.lines; done++;
          return next();
        });
      }
      return next().then(function () {
        S.seq++; S.syncedAt = Date.now(); S.offline = false;
        toast(isNew ? 'New item added' : 'Saved');
        closeSheet(); render();
      });
    }).catch(function (e) {
      S.seq++; render();
      if (e && e.error === 'bad_code') { showGate(problemText(e)); return; }
      var left = sh.pending.length;
      if (S.sheet === sh) { S.saving = false; openSheet(sh); formMsg((sh.id && left ? 'The line is saved, but ' + left + (left === 1 ? ' photo is' : ' photos are') + ' not yet. ' : 'Not saved. ') + (e && e.error === 'network' ? 'No connection to the storage. Check the signal and save again.' : problemText(e))); }
    });
  }
  function deletePhoto(photo) {
    var sh = S.sheet; if (!sh || sh.type !== 'newitem' || !sh.id || S.saving) return;
    keepNewItemFields();
    S.seq++;
    setSaving(true, 'Removing the photo…');
    api('photo_del', { quotation: S.qid, id: sh.id, photo: photo, by: S.name }).then(function (j) {
      S.seq++; S.lines = j.lines || []; sh.photos = (sh.photos || []).filter(function (p) { return p !== photo; });
      S.saving = false; openSheet(sh); render();
    }).catch(function (e) { writeFailed(e, 'removed'); });
  }

  function createQuote() {
    var name = $('fCustomer').value.replace(/\s+/g, ' ').trim();
    if (!name) { formMsg('Type the customer’s name.'); return; }
    if (S.saving) return;
    S.seq++;
    setSaving(true, 'Starting…');
    api('create', { customer: name, by: S.name, day: today6() }).then(function (j) {
      S.seq++; S.saving = false;
      closeSheet();
      toast(j.quotation.id + ' started');
      return loadAll(j.quotation.id);
    }).catch(function (e) { writeFailed(e, 'started'); });
  }

  /* ---------- scanning ---------- */
  function scanMsg(t) { $('scanMsg').textContent = t || ''; }
  function idleMsg() {
    if (S.cat.state !== 'ready') return catalogLine() || 'The item list is not on this phone yet.';
    if (!S.scan.live) return 'The live camera isn’t available here (' + (S.scan.why || 'not started') + '). Take a photo of the barcode, or use Read item number.';
    return 'Point at the barcode or the printed item number. Items are added by themselves.' + (S.scan.textReady ? '' : ' The text reader is still loading; barcodes already work.');
  }
  function openScan() {
    S.scan.open = true; S.scan.last = null; S.scan.cool = null;
    S.scan.sight = null; S.scan.deciding = false; S.scan.cycle = null; S.scan.streak = {}; S.scan.recent = {}; S.scan.adding = false;
    hideNote();
    $('scan').hidden = false; $('typeRow').hidden = true;
    startCamera();
    startTextLoop();
  }
  function closeScan() {
    S.scan.open = false;
    clearTimeout(S.scan.decideTimer); S.scan.sight = null; S.scan.deciding = false;
    stopCamera();
    $('scan').hidden = true;
  }
  function stopCamera() {
    S.scan.live = false; clearTimeout(S.scan.timer);
    if (S.scan.stream) { S.scan.stream.getTracks().forEach(function (t) { t.stop(); }); S.scan.stream = null; }
    $('video').srcObject = null;
  }
  function cameraFailed(why) {
    S.scan.live = false; S.scan.starting = false; S.scan.why = why;
    scanMsg(idleMsg());
  }
  function startCamera() {
    if (S.scan.stream || S.scan.starting) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraFailed('this browser gives pages no camera access'); return; }
    S.scan.starting = true;
    scanMsg('Starting the camera…');
    var slow = setTimeout(function () { if (S.scan.starting) scanMsg('The camera hasn’t answered yet. If nothing happens, take a photo or type the number.'); }, 6000);
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (stream) {
      clearTimeout(slow); S.scan.starting = false;
      if (!S.scan.open) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      S.scan.stream = stream;
      var v = $('video'); v.srcObject = stream;
      var p = v.play(); if (p && p.catch) p.catch(function () { /* autoplay refusals surface as no frames */ });
      S.scan.live = true; S.scan.paused = !!S.sheet;
      scanMsg(idleMsg());
      tick();
    }).catch(function (e) {
      clearTimeout(slow);
      cameraFailed(e && e.name === 'NotAllowedError' ? 'permission was refused' : (e && e.name) || 'unknown reason');
    });
  }
  function resumeLive() {
    S.scan.paused = false; S.scan.last = null;
    $('scan').classList.remove('is-hit');
    scanMsg(idleMsg());
    if (S.scan.live) { clearTimeout(S.scan.timer); tick(); }
  }
  function tick() {
    if (!S.scan.live || S.scan.paused || !S.scan.open) return;
    if (S.scan.deciding) {                       /* a barcode is waiting for the printed number: only keep track of where it is */
      Decoder.decodeFrame($('video')).catch(function () { return null; }).then(function (r) {
        if (r && r.span) S.scan.box = { span: r.span, at: Date.now() };
        if (S.scan.live && S.scan.open && !S.scan.paused) S.scan.timer = setTimeout(tick, 150);
      });
      return;
    }
    Decoder.decodeFrame($('video')).catch(function () { return null; }).then(function (r) {
      if (!S.scan.live || S.scan.paused || !S.scan.open) return;
      if (r && r.span) S.scan.box = { span: r.span, at: Date.now() };
      if (r && r.code === S.scan.cool && Date.now() < S.scan.coolUntil) S.scan.coolUntil = Date.now() + 2500;   /* still in view: stay quiet */
      else if (r) {
        /* accept at once when the engine is the phone's own detector or the code is in the item list;
           otherwise wait for the same read twice in a row */
        if (r.engine === 'native' || isKnownCode(r.code) || S.scan.last === r.code) { sawBarcode(r.code); S.scan.timer = setTimeout(tick, 120); return; }
        S.scan.last = r.code;
      }
      S.scan.timer = setTimeout(tick, 90);
    });
  }

  function onCode(code, via, sure) {
    S.scan.paused = true;
    $('scan').classList.add('is-hit');
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* not supported */ } }
    if (S.cat.state !== 'ready') { openSheet({ type: 'info', title: code, text: catalogLine() || 'The item list is not on this phone yet, so this barcode cannot be looked up.', code: code }); return; }
    var hits = itemsForEan(code);
    if (hits.length === 1 && sure !== false) autoAdd(hits[0], via, code);
    else if (hits.length === 1) chooseItem(hits[0], via, code);
    else if (hits.length > 1) openSheet({ type: 'pick', title: code, text: hits.length + ' items share this barcode. Tap the one in hand.', items: hits, via: via, code: code, auto: true });
    else openSheet({ type: 'notfound', title: code, code: code, ean: code, via: via,
      text: sure === false ? 'This read could not be confirmed, and it is not in the item list. Scan again first.' : 'This barcode is not in the item list.' });
  }

  /* ---------- adding by itself: barcode and printed item number ---------- */
  function showNote(title, sub, buttons, bad, keep) {
    var n = $('scanNote');
    n.className = 'scan-note' + (bad ? ' is-bad' : '');
    n.innerHTML = '<b>' + esc(title) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') +
      '<div class="note-btns">' + (buttons || []).map(function (b) { return '<button data-act="' + b.act + '"' + (b.id ? ' data-id="' + esc(b.id) + '"' : '') + '>' + esc(b.label) + '</button>'; }).join('') + '</div>';
    n.hidden = false;
    clearTimeout(S.scan.noteTimer);
    if (!keep) S.scan.noteTimer = setTimeout(hideNote, 7000);
  }
  function hideNote() { clearTimeout(S.scan.noteTimer); $('scanNote').hidden = true; }
  function quiet(itemNo, code) {            /* do not react to the same item again while it stays in view */
    if (itemNo) S.scan.recent[String(itemNo).toUpperCase()] = Date.now() + 4000;
    if (code) { S.scan.cool = code; S.scan.coolUntil = Date.now() + 4000; }
  }
  function isQuiet(itemNo) { return (S.scan.recent[String(itemNo).toUpperCase()] || 0) > Date.now(); }
  /* longer item numbers that begin with this one: the camera may have read only the first part */
  function extensionsOf(itemNo, limit) {
    var u = String(itemNo).toUpperCase(), out = [];
    for (var i = 0; i < S.cat.upper.length && out.length < limit; i++) if (S.cat.upper[i].length > u.length && S.cat.upper[i].indexOf(u) === 0) out.push(itemAt(i));
    return out;
  }

  function autoAdd(it, via, code) {
    quiet(it.item, code);
    var has = lineForItem(it.item);
    if (has) {
      showNote('Already in this quotation: ' + it.item, it.name, [{ act: 'note-edit', id: has.id, label: 'Quantity / note' }]);
      if (!S.sheet) resumeLive();
      return;
    }
    if (S.scan.adding) return;
    S.scan.adding = true; S.scan.paused = true;
    var line = { id: newId(), type: 'item', item: it.item, ean: it.ean, name: it.name, qty: '', note: '', via: via };
    S.seq++;
    showNote('Adding ' + it.item + '…', it.name, [], false, true);
    api('line', { quotation: S.qid, line: line, by: S.name }).then(function (j) {
      S.seq++; S.lines = j.lines || []; S.syncedAt = Date.now(); S.offline = false; render();
      $('scan').classList.add('is-hit');
      if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* not supported */ } }
      showNote('Added ' + it.item, it.name + (VIA[via] ? ' (' + VIA[via].charAt(0).toLowerCase() + VIA[via].slice(1) + ')' : ''), [{ act: 'note-undo', id: line.id, label: 'Undo' }, { act: 'note-edit', id: line.id, label: 'Quantity / note' }]);
    }).catch(function (e) {
      S.seq++;
      if (e && e.error === 'bad_code') { showGate(problemText(e)); return; }
      S.scan.retry = { it: it, via: via, code: code };
      delete S.scan.recent[String(it.item).toUpperCase()]; S.scan.coolUntil = Date.now() + 6000;
      showNote('Not added: ' + it.item, e && e.error === 'network' ? 'No connection to the storage. Check the signal.' : problemText(e), [{ act: 'note-retry', label: 'Try again' }], true, true);
    }).then(function () {
      S.scan.adding = false;
      quiet(it.item, code);
      if (S.scan.open && !S.sheet) setTimeout(function () { if (S.scan.open && !S.sheet && !S.scan.adding) resumeLive(); }, 600);
    });
  }
  function undoAdd(id) {
    var ln = lineById(id); if (!ln) { hideNote(); return; }
    S.seq++;
    showNote('Removing ' + ln.item + '…', '', [], false, true);
    api('unline', { quotation: S.qid, id: id }).then(function (j) {
      S.seq++; S.lines = j.lines || []; render(); quiet(ln.item, ln.ean);
      showNote('Removed ' + ln.item, 'It is no longer in the quotation.', []);
    }).catch(function (e) {
      S.seq++; showNote('Not removed: ' + ln.item, e && e.error === 'network' ? 'No connection to the storage.' : problemText(e), [{ act: 'note-undo', id: id, label: 'Try again' }], true, true);
    });
  }
  function ask(sheet) { S.scan.paused = true; $('scan').classList.add('is-hit'); hideNote(); openSheet(sheet); }

  /* a barcode was read by the live camera: give the text reader a moment to see the printed number too */
  function sawBarcode(code) {
    if (S.scan.sight || S.scan.adding) return;
    S.scan.sight = { code: code, at: Date.now(), items: itemsForEan(code), tries: 0 };
    S.scan.deciding = true;
    clearTimeout(S.scan.decideTimer);
    /* text reader ready: a short look for the printed number. Still loading: wait for it. Not available: the barcode decides. */
    S.scan.decideTimer = setTimeout(decideBarcode, S.cat.state !== 'ready' || S.scan.textFailed ? 0 : S.scan.textReady ? 1800 : 6000);
  }
  function decideBarcode() {
    var sg = S.scan.sight; if (!sg || !S.scan.open) return;
    clearTimeout(S.scan.decideTimer);
    if (S.cat.state !== 'ready') { S.scan.sight = null; S.scan.deciding = false; onCode(sg.code, 'camera', true); return; }
    var cyc = S.scan.cycle, seen = (cyc && cyc.at >= sg.at - 600) ? cyc.items : [];
    var agree = seen.filter(function (t) { return sg.items.some(function (i) { return i.item === t.item; }); });
    var steady = seen.filter(function (t) { return (S.scan.streak[t.item] || 0) >= 2; });
    /* a number that was read only once and does not match may be a misread: look once more before asking */
    if (!agree.length && seen.length && !steady.length && sg.tries < 2) { sg.tries++; S.scan.decideTimer = setTimeout(decideBarcode, 1800); return; }
    S.scan.sight = null; S.scan.deciding = false;
    if (agree.length === 1) { autoAdd(agree[0], 'both', sg.code); return; }
    if (steady.length && sg.items.length) {
      ask({ type: 'pick', title: 'Barcode and item number differ', auto: true, via: 'camera', code: sg.code,
            text: 'The barcode ' + sg.code + ' belongs to ' + sg.items.map(function (i) { return i.item; }).join(', ') + ', but the printed number reads ' + steady.map(function (i) { return i.item; }).join(', ') + '. Tap the item in hand.',
            items: sg.items.concat(steady.filter(function (t) { return !sg.items.some(function (i) { return i.item === t.item; }); })) });
      return;
    }
    if (!sg.items.length && steady.length) {
      ask({ type: 'pick', title: 'Barcode not in the item list', auto: true, via: 'text', code: sg.code,
            text: 'The barcode ' + sg.code + ' is not in the item list. The printed number reads as below. Tap it if that is the item.', items: steady, more: extensionsOf(steady[0].item, 8) });
      return;
    }
    if (sg.items.length === 1) { autoAdd(sg.items[0], 'camera', sg.code); return; }
    S.scan.paused = true;
    onCode(sg.code, 'camera', true);                     /* several items share it, or it is unknown: ask */
  }

  /* the text reader looks at the framed band again and again while the scan screen is open */
  function startTextLoop() {
    if (S.scan.textOn) return;
    S.scan.textOn = true;
    var run = ++S.scan.textRun;
    textReader().then(function (worker) {
      if (S.scan.open && !S.scan.paused && S.scan.live) scanMsg(idleMsg());
      function cycle() {
        if (!S.scan.open || run !== S.scan.textRun) { S.scan.textOn = false; return; }
        var v = $('video');
        if (!S.scan.live || S.scan.paused || S.cat.state !== 'ready' || !v.videoWidth) { setTimeout(cycle, 250); return; }
        var at = Date.now(), vw = v.videoWidth, vh = v.videoHeight;
        var band = canvasOf(v, vw, vh, { x: 0, y: Math.round(vh * 0.25), w: vw, h: Math.round(vh * 0.5) }, 1100);
        var box = S.scan.box && at - S.scan.box.at < 1500 ? S.scan.box.span : null;
        if (box) {                                  /* cover the barcode: next to one, the reader overlooks printed text */
          var g = band.getContext('2d'), x0 = Math.max(0, box[0] - 0.05) * band.width, x1 = Math.min(1, box[1] + 0.05) * band.width;
          g.fillStyle = '#fff'; g.fillRect(x0, 0, x1 - x0, band.height);
        }
        var looks = [function () { return ItemRead.prep(band, false); }, function () { return ItemRead.prep(band, true); }, function () { return band; }], i = 0;
        function done(items) {
          var streak = {};
          items.forEach(function (it) { streak[it.item] = (S.scan.streak[it.item] || 0) + 1; });
          S.scan.streak = streak; S.scan.cycle = { at: at, items: items };
          if (S.scan.open && !S.scan.paused) {
            if (S.scan.sight) { if (at >= S.scan.sight.at - 600) decideBarcode(); }
            else textAlone(items);
          }
          setTimeout(cycle, 60);
        }
        function look() {
          if (i >= looks.length) { done([]); return; }
          worker.setParameters({ tessedit_pageseg_mode: '6' }).then(function () { return worker.recognize(looks[i++]()); }).then(function (r) {
            var found = ItemRead.match(r.data.text, S.cat.byItem, S.cat.upper, 6, true).map(itemAt);
            if (found.length) done(found); else look();
          }).catch(function () { done([]); });
        }
        look();
      }
      cycle();
    }).catch(function () { S.scan.textOn = false; });
  }
  /* no barcode in view: a printed number counts once it was read the same way twice in a row */
  function textAlone(items) {
    if (S.scan.adding || S.scan.deciding) return;
    items.forEach(function (it) { if (isQuiet(it.item)) quiet(it.item); });          /* still in view: stay quiet */
    var fresh = items.filter(function (it) { return !isQuiet(it.item); });
    var steady = fresh.filter(function (it) { return (S.scan.streak[it.item] || 0) >= 2; });
    if (!steady.length) return;
    var longer = extensionsOf(steady[0].item, 8);
    if (steady.length === 1 && items.length === 1 && !longer.length) { autoAdd(steady[0], 'text'); return; }
    steady.forEach(function (it) { quiet(it.item); });
    ask({ type: 'pick', title: 'Which item?', auto: true, via: 'text',
          text: steady.length > 1 ? 'Several item numbers are in the picture. Tap the item in hand.' : 'Longer item numbers start the same way, so the camera may have read only part of it. Tap the item in hand.',
          items: steady, more: longer.filter(function (x) { return !steady.some(function (y) { return y.item === x.item; }); }) });
  }

  function fileToSource(file) {
    var viaBitmap = window.createImageBitmap
      ? window.createImageBitmap(file).then(function (b) { return { el: b, w: b.width, h: b.height }; })
      : Promise.reject(new Error('no createImageBitmap'));
    return viaBitmap.catch(function () {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onerror = function () { reject(new Error('read failed')); };
        fr.onload = function () {
          var im = new Image();
          im.onload = function () { resolve({ el: im, w: im.naturalWidth, h: im.naturalHeight }); };
          im.onerror = function () { reject(new Error('decode failed')); };
          im.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    });
  }

  function onPhoto(file) {
    S.scan.paused = true;
    scanMsg('Reading the photo…');
    fileToSource(file).then(function (src) {
      return Decoder.decodeStill(src.el, src.w, src.h, isKnownCode);
    }).then(function (r) {
      if (r) { onCode(r.code, 'photo', r.sure); return; }
      resumeLive();
      scanMsg('No barcode found in that photo. Fill the frame with the barcode, keep it sharp, and try again.');
    }).catch(function () {
      resumeLive();
      scanMsg('That photo couldn’t be opened. Take it again.');
    });
  }

  function typedLookup() {
    var d = Decoder.digitsOnly($('typeIn').value);
    if (d.length < 8 || d.length > 14) { scanMsg('An EAN has 8, 12, 13 or 14 digits. This one has ' + d.length + '.'); return; }
    if (!isKnownCode(d) && !Decoder.checkDigitOk(d)) { scanMsg('That number’s check digit doesn’t add up. Check it against the label.'); return; }
    $('typeIn').value = '';
    onCode(d, 'typed', true);
  }

  /* ---------- reading a printed item number ---------- */
  var ocrWorker = null;
  function textReader() {
    if (ocrWorker) return ocrWorker;
    ocrWorker = new Promise(function (resolve, reject) {
      function start() {
        window.Tesseract.createWorker('eng', 1, { workerPath: OCR.worker, corePath: OCR.core, langPath: OCR.lang, gzip: true }).then(resolve, reject);
      }
      if (window.Tesseract) { start(); return; }
      var el = document.createElement('script'); el.src = OCR.script; el.async = true;
      el.onload = start; el.onerror = function () { el.remove(); reject(new Error('download')); };
      document.head.appendChild(el);
    });
    S.scan.textFailed = false;
    ocrWorker.then(function () { S.scan.textReady = true; }, function () { ocrWorker = null; S.scan.textFailed = true; });
    return ocrWorker;
  }
  function canvasOf(source, sw, sh, crop, maxW) {
    crop = crop || { x: 0, y: 0, w: sw, h: sh };
    var s = Math.min(1, maxW / crop.w);
    var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(crop.w * s)); c.height = Math.max(1, Math.round(crop.h * s));
    c.getContext('2d').drawImage(source, crop.x, crop.y, crop.w, crop.h, 0, 0, c.width, c.height);
    return c;
  }
  /* passes: [canvas, page mode]; stops at the first pass that finds item numbers from the list */
  function readText(passes) {
    return textReader().then(function (worker) {
      var i = 0;
      function next() {
        if (i >= passes.length) return [];
        var p = passes[i++];
        return worker.setParameters({ tessedit_pageseg_mode: String(p[1]) }).then(function () { return worker.recognize(p[0]); }).then(function (r) {
          var found = ItemRead.match(r.data.text, S.cat.byItem, S.cat.upper, 6).map(itemAt);     /* the index gives positions in the item list */
          return found.length ? found : next();
        });
      }
      return next();
    });
  }
  function showRead(found) {
    if (!found.length) {
      openSheet({ type: 'notfound', title: 'No item number read', text: 'Nothing in the picture matches an item number from the item list. Move closer so the number fills the frame, or find the item by typing.' });
      return;
    }
    openSheet({ type: 'pick', title: 'Which item?', auto: true, via: 'text', text: 'Read from the picture. Tap the item in hand.', items: found,
                more: siblings(found[0].item, 8).filter(function (s) { return !found.some(function (f) { return f.item === s.item; }); }) });
  }
  function readFailed() {
    resumeLive();
    scanMsg('The text reader could not be downloaded. Check the connection, or find the item by typing.');
  }
  function readPrinted() {
    if (S.cat.state !== 'ready') { scanMsg(idleMsg()); return; }
    var v = $('video');
    if (!S.scan.live || !v.videoWidth) { $('ocrIn').click(); return; }
    S.scan.paused = true;
    scanMsg('Reading the item number…');
    var vw = v.videoWidth, vh = v.videoHeight;
    var band = canvasOf(v, vw, vh, { x: 0, y: Math.round(vh * 0.25), w: vw, h: Math.round(vh * 0.5) }, 1600);
    var full = canvasOf(v, vw, vh, null, 1600);
    /* the framed band first: as printed, as light print on dark, untouched; then the whole frame */
    readText([[ItemRead.prep(band, false), 6], [ItemRead.prep(band, true), 6], [band, 6], [ItemRead.prep(full, false), 3], [ItemRead.prep(full, true), 3]]).then(showRead).catch(readFailed);
  }
  function onOcrPhoto(file) {
    S.scan.paused = true;
    scanMsg('Reading the item number…');
    fileToSource(file).then(function (src) {
      var pic = canvasOf(src.el, src.w, src.h, null, 1600);
      return readText([[ItemRead.prep(pic, false), 3], [ItemRead.prep(pic, true), 3], [pic, 3]]);
    }).then(showRead).catch(readFailed);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b) { if (ev.target === $('veil') && !S.saving) closeSheet(); return; }
    var act = b.getAttribute('data-act'), sh = S.sheet;
    if (act === 'scan') openScan();
    else if (act === 'scan-close') closeScan();
    else if (act === 'type-toggle') { var tr = $('typeRow'); tr.hidden = !tr.hidden; if (!tr.hidden) $('typeIn').focus(); }
    else if (act === 'type-go') typedLookup();
    else if (act === 'read-text') { if (!S.scan.open) openScan(); else readPrinted(); }
    else if (act === 'open-line') { var l = lineById(b.getAttribute('data-id')); if (l) openSheet(l.type === 'new' ? { type: 'newitem', id: l.id } : { type: 'line', id: l.id, via: '' }); }
    else if (act === 'pick-item') {
      var it = itemByNumber(b.getAttribute('data-item'));
      if (it && sh && sh.auto) { var via = sh.via, code = sh.code; S.sheet = null; $('veil').hidden = true; autoAdd(it, via, code); }      /* asked because unsure: the tap is the answer */
      else if (it) chooseItem(it, sh && sh.type === 'find' ? 'find' : (sh && sh.via) || 'find', sh && sh.code);
    }
    else if (act === 'note-undo') undoAdd(b.getAttribute('data-id'));
    else if (act === 'note-edit') { var ln = lineById(b.getAttribute('data-id')); hideNote(); if (ln) { S.scan.paused = true; openSheet({ type: 'line', id: ln.id, via: '' }); } }
    else if (act === 'note-retry') { var again = S.scan.retry; S.scan.retry = null; if (again) autoAdd(again.it, again.via, again.code); }
    else if (act === 'find') openSheet({ type: 'find', code: sh && sh.code });
    else if (act === 'new-item') openSheet({ type: 'newitem', ean: sh && sh.ean ? sh.ean : '', code: sh && sh.code, via: 'new' });
    else if (act === 'save-line') saveLine();
    else if (act === 'save-new') saveNewItem();
    else if (act === 'remove-line') removeLine();
    else if (act === 'photo-del') deletePhoto(b.getAttribute('data-photo'));
    else if (act === 'photo-drop') { keepNewItemFields(); sh.pending.splice(Number(b.getAttribute('data-i')), 1); openSheet(sh); }
    else if (act === 'sheet-close') closeSheet();
    else if (act === 'new-quote') openSheet({ type: 'newquote' });
    else if (act === 'create-quote') createQuote();
    else if (act === 'refresh') { loadAll().then(function () { if (S.status === 'ready' && !S.offline) toast('Refreshed'); }); }
    else if (act === 'signout') showGate('');
  });
  document.addEventListener('input', function (ev) { if (ev.target && ev.target.id === 'findIn') renderFind(); });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || !ev.target) return;
    if (ev.target.id === 'typeIn') typedLookup();
    else if (ev.target.id === 'fCustomer') createQuote();
  });
  $('quoteSel').addEventListener('change', function () {
    if (this.value === '__new__' || !this.value) { var add = this.value === '__new__'; render(); if (add) openSheet({ type: 'newquote' }); return; }
    S.quote = null; S.lines = []; S.qid = this.value;
    loadAll(this.value);
  });
  $('photoIn').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) onPhoto(f); });
  $('ocrIn').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) onOcrPhoto(f); });
  $('newPhotoIn').addEventListener('change', function () { var fs = this.files; if (fs && fs.length) onNewPhotos(fs); this.value = ''; });
  $('gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); submitGate(); });
  document.addEventListener('visibilitychange', function () {
    if (S.scan.open) { if (document.hidden) stopCamera(); else startCamera(); }
    if (!document.hidden) refreshQuiet();
  });
  setInterval(refreshQuiet, REFRESH_MS);

  /* ---------- start ---------- */
  if (!CONNECTED) { S.status = 'unconfigured'; render(); return; }
  S.code = recall('scan.code'); S.name = recall('scan.name');
  if (S.code && S.name) { S.status = 'loading'; render(); loadAll(); }
  else showGate('');
})();
</script>
</body>
</html>
